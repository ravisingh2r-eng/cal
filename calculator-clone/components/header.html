<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags - Will be replaced per page -->
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="keywords" content="{{KEYWORDS}}">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{URL}}">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{CANONICAL_URL}}">

    <!-- Google Analytics 4 (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX', {
            'send_page_view': true,
            'anonymize_ip': true,
            'cookie_flags': 'SameSite=None;Secure'
        });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/categories.css">
    <link rel="stylesheet" href="../css/calculator-page.css">
    <link rel="stylesheet" href="../css/share-buttons.css">
    <link rel="stylesheet" href="../css/spinner.css">
    <link rel="stylesheet" href="../css/print.css">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXX"
         crossorigin="anonymous"></script>

    <!-- Analytics Tracking -->
    <script src="../js/analytics.js"></script>
    <script src="../js/share.js"></script>
    <script src="../js/spinner.js"></script>
    <script src="../js/print.js"></script>
    
    <!-- Schema Markup -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "{{CALCULATOR_NAME}}",
        "applicationCategory": "FinanceApplication",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR"
        },
        "operatingSystem": "Web",
        "description": "{{DESCRIPTION}}"
    }
    </script>
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="../index.html">🧮 Calculator Platform</a>
                </div>
                <nav class="main-nav">
                    <ul>
                        <li><a href="../index.html">Home</a></li>
                        <li><a href="../categories/financial.html">Financial</a></li>
                        <li><a href="../categories/investment.html">Investment</a></li>
                        <li><a href="../categories/loan.html">Loan</a></li>
                        <li><a href="../categories/health.html">Health</a></li>
                        <li class="dropdown">
                            <a href="#" class="dropdown-toggle">More ▼</a>
                            <ul class="dropdown-menu">
                                <li><a href="../categories/tax.html">Tax Calculators</a></li>
                                <li><a href="../categories/education.html">Education</a></li>
                                <li><a href="../categories/converters.html">Converters</a></li>
                                <li><a href="../categories/utility.html">Utility</a></li>
                            </ul>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- Top Banner Ad -->
    <div class="ad-container ad-top-banner">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXXXXXX"
             data-ad-slot="1234567890"
             data-ad-format="horizontal"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <!-- Breadcrumbs -->
    <nav class="breadcrumb">
        <div class="container">
            <a href="../index.html">Home</a> › 
            <a href="{{CATEGORY_URL}}">{{CATEGORY}}</a> › 
            <span>{{CALCULATOR_NAME}}</span>
        </div>
    </nav>
