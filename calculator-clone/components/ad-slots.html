<!-- Ad Slot Templates -->

<!-- Top Ad Slot (Horizontal Banner) -->
<div class="ad-container ad-top">
    <div class="ad-label">Advertisement</div>
    <div id="ad-slot-top" class="ad-slot ad-horizontal"></div>
</div>

<!-- Middle Ad Slot (Horizontal Banner) -->
<div class="ad-container ad-middle">
    <div class="ad-label">Advertisement</div>
    <div id="ad-slot-middle" class="ad-slot ad-horizontal"></div>
</div>

<!-- Bottom Ad Slot (Horizontal Banner) -->
<div class="ad-container ad-bottom">
    <div class="ad-label">Advertisement</div>
    <div id="ad-slot-bottom" class="ad-slot ad-horizontal"></div>
</div>

<!-- Sidebar Ad Slot (Vertical Rectangle) -->
<div class="ad-container ad-sidebar">
    <div class="ad-label">Advertisement</div>
    <div id="ad-slot-sidebar" class="ad-slot ad-vertical"></div>
</div>

<!-- Sticky Mobile Ad -->
<div id="stickyMobileAd" class="sticky-mobile-ad">
    <button class="ad-close" aria-label="Close ad">&times;</button>
    <div id="ad-slot-sticky-mobile" class="ad-slot"></div>
</div>

<!-- In-Content Ad (Auto-placed) -->
<div class="ad-container in-content-ad">
    <div class="ad-label">Advertisement</div>
    <div id="ad-slot-in-content" class="ad-slot ad-horizontal"></div>
</div>
