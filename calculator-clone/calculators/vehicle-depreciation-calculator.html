<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Depreciation Calculator - Free Vehicle Finance Calculator</title>
    <meta name="description" content="Free Vehicle Depreciation Calculator. Calculate loan EMI, depreciation, and make informed vehicle purchase decisions.">
    <meta name="keywords" content="car depreciation calculator resale value, vehicle loan calculator, auto finance">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/calculators.css">
    <link rel="stylesheet" href="/css/ads.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo"><a href="/">Calculator Platform</a></div>
            <button id="themeToggle" class="theme-toggle"></button>
        </div>
    </header>
    <main class="calculator-page">
        <div class="container">
            <h1>Vehicle Depreciation Calculator</h1>
            <div class="ad-container ad-top">
                <div class="ad-label">Advertisement</div>
                <div id="ad-slot-top" class="ad-slot"></div>
            </div>
            <div class="calculator-card">
                <div id="calculatorInputs"></div>
                <button id="calculate" class="btn btn-primary btn-large">Calculate</button>
                <div id="results" class="results-card" style="display:none;"></div>
            </div>
            <div class="ad-container ad-bottom">
                <div class="ad-label">Advertisement</div>
                <div id="ad-slot-bottom" class="ad-slot"></div>
            </div>
        </div>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/ad-manager.js"></script>
    <script src="/js/calculators/vehicle-depreciation-calculator.js"></script>
</body>
</html>
