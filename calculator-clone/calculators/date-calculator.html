<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Calculator - Free Online Calculator</title>
    <meta name="description" content="Free Date Calculator. Easy to use and accurate calculations.">
    <meta name="keywords" content="date calculator, online calculator, free calculator">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/calculators.css">
    <link rel="stylesheet" href="/css/ads.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo"><a href="/">Calculator Platform</a></div>
            <button id="themeToggle" class="theme-toggle"></button>
        </div>
    </header>
    <main class="calculator-page">
        <div class="container">
            <h1>Date Calculator</h1>
            <div class="ad-container ad-top">
                <div class="ad-label">Advertisement</div>
                <div id="ad-slot-top" class="ad-slot"></div>
            </div>
            <div class="calculator-layout">
                <div class="calculator-main">
                    <div class="calculator-card">
                        <div id="calculatorInputs"></div>
                        <button id="calculate" class="btn btn-primary btn-large">Calculate</button>
                        <div id="results" class="results-card" style="display:none;"></div>
                    </div>
                </div>
                <aside class="calculator-sidebar">
                    <div class="ad-container ad-sidebar">
                        <div class="ad-label">Advertisement</div>
                        <div id="ad-slot-sidebar" class="ad-slot"></div>
                    </div>
                </aside>
            </div>
        </div>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/ad-manager.js"></script>
    <script src="/js/calculators/date-calculator.js"></script>
</body>
</html>
